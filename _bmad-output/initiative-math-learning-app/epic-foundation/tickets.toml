# epic-foundation breakdown. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Tracer: one number-line answer through every layer"
description = "Scaffolds Spring Boot 4.1 (Maven, Java 25, server.address=127.0.0.1) and Vite React-TS with Vitest, bundled into one jar by frontend-maven-plugin (Node 22) with Vitest in ./mvnw verify, plus start.sh (Java 25 check, --demo flag enabling the demo profile); the backend serves one demo concept from content/demo/ at /api/concepts/{id}, and React shows a minimal number line where a mouse drag is compared to the expected answer."
verify = "On a machine with Java 25, start.sh --demo opens 127.0.0.1:8080, dragging the point to the right spot shows correct, and ./mvnw verify runs one Vitest test; without Java 25, start.sh prints install instructions and exits."
covers = ["E1", "E4", "E5"]
after = []
hitl = true
risk = "medium"
notes = ["Parent installs JDK 25 and Node 22 and runs start.sh."]

[[entry]]
id = 2
type = "story"
title = "Generated API contract and error handling"
description = "Adds springdoc-openapi 3.x with openapi.json exported in the Maven build, frontend API types generated by openapi-typescript 7.x (TypeScript pinned 6.0.x with npm overrides) replacing entry 1's hand-written API type, ProblemDetail enabled with one global @RestControllerAdvice, and unknown /api paths returning 404 while other paths serve the SPA."
verify = "./mvnw verify regenerates types and a changed DTO field breaks the frontend build; GET /api/nope returns a 404 ProblemDetail; GET /map returns index.html."
covers = ["E5"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Learner profile and data that survives upgrades"
description = "Adds H2 file mode in ${app.data-dir} (default ~/.mathjourney), Flyway V1 creating learner_profile as a single row with ddl-auto=validate, and GET /api/learner returning { onboardingStage: journey, settings: { sound: true, companionName: Lumi } } for epics 2-4 to consume."
verify = "First start creates the DB and GET /api/learner returns the defaults; after replacing the jar with a rebuilt one and restarting, a manually changed field is still there."
covers = ["E1"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Concept and curriculum schemas, enforced at startup"
description = "Adds concept.schema.json (AD-12 envelope with reviewed, retired, item roles, nudge, hint, walkthrough), number-line.schema.json (discrete response, canonical answer, equivalence), curriculum.json with five empty lands and empty prerequisites, the demo curriculum, and a loader that validates every file, enforces AD-12 minimum items per role and cross-checks curriculum at startup; moves the demo concept to the full envelope and updates entry 1's frontend type to it until entry 6 generates types."
verify = "A broken required field, too few practice items, or an unknown id in a curriculum stops startup with a log line naming file and JSON path; start.sh --demo still answers the demo; the catalog exposes reviewed."
covers = ["E2"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Answer verification and shared fixtures"
description = "Adds the Java AnswerVerifier contract and kind registry, the number-line verifier computing every item's answer including walkthrough similar problems and refusing startup on mismatch, AnswerVerifier unit tests, and content/fixtures/number-line/ (response, canonical, verdict) run by Java tests; entry 7 runs the same fixtures in TypeScript."
verify = "Changing a stored answer, or a walkthrough similar answer, in the demo concept stops startup naming the item; verifier unit tests and Java fixture tests pass in ./mvnw verify."
covers = ["E3"]
after = [4]
hitl = false
risk = "high"

