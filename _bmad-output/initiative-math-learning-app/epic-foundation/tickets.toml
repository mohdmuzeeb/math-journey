id = 6
type = "story"
title = "Design tokens, activity registry and feedback strip"
description = "Adds Orchid Pop tokens from DESIGN.md as CSS variables, content TypeScript types generated from content/schemas replacing entry 4's hand-written type, the React activity-kind registry keyed by kind (AD-6), the Check button disabled until an answer exists, and the green/amber feedback strip that receives focus and stays until her next action; the demo number line moves behind the registry."
